<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
  </defs>
  <!-- Background circular shield -->
  <rect width="100" height="100" rx="24" fill="#FFFFFF" />
  <circle cx="50" cy="50" r="44" stroke="#F1F5F9" stroke-width="3" />
  
  <!-- Red Pharmacy Cross Vertical Bar -->
  <rect x="42" y="22" width="16" height="56" rx="8" fill="url(#redGrad)" />
  <!-- Red Pharmacy Cross Horizontal Bar -->
  <rect x="22" y="42" width="56" height="16" rx="8" fill="url(#redGrad)" />
  
  <!-- Green Vitality Leaf overlapping -->
  <path d="M50 36 C64 36 74 46 74 60 C74 70 66 76 56 76 C50 76 46 72 46 66 C46 54 50 44 50 36 Z" fill="url(#greenGrad)" opacity="0.95" />
  <path d="M52 46 Q 64 56 60 68" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8" />
  
  <!-- Subtle ES Heart Accent -->
